services:
  postgres:
    image: postgres:16-alpine
    container_name: nexplm-postgres
    environment:
      POSTGRES_DB: ${NEXPLM_DB_NAME:-nexplm}
      POSTGRES_USER: ${NEXPLM_DB_USER:-nexplm}
      POSTGRES_PASSWORD: ${NEXPLM_DB_PASSWORD:-nexplm}
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
    ports:
      - "${NEXPLM_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXPLM_DB_USER:-nexplm} -d ${NEXPLM_DB_NAME:-nexplm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexplm-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${NEXPLM_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: nexplm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NEXPLM_MINIO_USER:-nexplm}
      MINIO_ROOT_PASSWORD: ${NEXPLM_MINIO_PASSWORD:-nexplm12345}
    ports:
      - "${NEXPLM_MINIO_PORT:-9000}:9000"
      - "${NEXPLM_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nexplm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${NEXPLM_MQ_USER:-nexplm}
      RABBITMQ_DEFAULT_PASS: ${NEXPLM_MQ_PASSWORD:-nexplm12345}
    ports:
      - "${NEXPLM_MQ_PORT:-5672}:5672"
      - "${NEXPLM_MQ_CONSOLE_PORT:-15672}:15672"
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  mqdata:
