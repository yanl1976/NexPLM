server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # 前置 nginx 终止 TLS 时，让 request.isSecure() 认 X-Forwarded-Proto / -Host（docs/07 ⑥）
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: nexplm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${NEXPLM_DB_URL:jdbc:postgresql://localhost:5432/nexplm}
    username: ${NEXPLM_DB_USER:nexplm}
    password: ${NEXPLM_DB_PASSWORD:nexplm}
    hikari:
      maximum-pool-size: ${NEXPLM_DB_POOL_MAX:20}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

flowable:
  # 引擎表（ACT_*）由 Flowable 自管：首次启动自动建表，升级随引擎脚本演进，**不纳入 Flyway**
  database-schema-update: true
  # 默认不启用异步作业线程（超时催办/定时任务接入后再打开）
  async-executor-activate: false
  # 启动时自动部署 classpath:/processes/ 下的流程定义（内容不变则不会重复部署）
  check-process-definitions: true
  process-definition-location-prefix: classpath*:/processes/
  # 只用 BPMN 流程引擎，关掉 CMMN / DMN / 表单 / 事件注册，减少建表与启动开销
  cmmn:
    enabled: false
  dmn:
    enabled: false
  form:
    enabled: false
  eventregistry:
    enabled: false

nexplm:
  # 流程归档后的 ERP 自动下发（ErpPublish 插件）
  workflow:
    erp-publish:
      enabled: ${NEXPLM_WF_ERP_PUBLISH_ENABLED:true}
      dry-run: ${NEXPLM_WF_ERP_PUBLISH_DRY_RUN:false}
      # 多账套时指定 itg_endpoint.code（测试/生产）；留空取 id 最小的启用端点。
      # 配置后找不到该端点会跳过下发，不会静默改用其它账套。
      endpoint-code: ${NEXPLM_WF_ERP_PUBLISH_ENDPOINT_CODE:}
  # 编码管理（T-CORE-01）：人工填写编码的形态约束（蓝本 Coding.setting 的等价物）
  coding:
    # 默认允许字母/数字/._-，1~64 位；现场若用图号（如 0CT.325.503）保持默认即可
    manual-pattern: '${NEXPLM_CODING_MANUAL_PATTERN:^[A-Za-z0-9._-]{1,64}$}'
    # 图号 → 编号模板：默认原样使用图号；可配 {DWG}-01 这类规则（占位符 {DWG}）
    drawing-pattern: '${NEXPLM_CODING_DRAWING_PATTERN:{DWG}}'
  # 文档预览（异步转换）：僵尸状态回收 + 用户级配额
  preview:
    # PENDING 超过该分钟数视为僵尸（进程重启/线程被中断），维护任务转 FAILED 可重试
    stale-minutes: ${NEXPLM_PREVIEW_STALE_MINUTES:5}
    # 每用户每分钟最多触发多少次生成（0=不限制）；与转换线程池的全局并发上限互补
    rate-limit-per-minute: ${NEXPLM_PREVIEW_RATE_LIMIT_PER_MINUTE:10}
    maintenance:
      enabled: ${NEXPLM_PREVIEW_MAINTENANCE:true}
      fixed-delay: PT60S
  security:
    jwt:
      # 生产必须通过环境变量覆盖，长度 >= 32 字节
      secret: ${NEXPLM_JWT_SECRET:nexplm-dev-only-secret-key-change-in-production-32b}
      access-ttl: PT30M
      refresh-ttl: P7D
    # HTTPS 强制（docs/07 待整改 ⑥）：默认关闭；生产在前置 nginx 终止 TLS 时设为 true，
    # 未带 X-Forwarded-Proto: https 的请求一律 308 到 https（actuator 探针跳过）
    https:
      enforce: ${NEXPLM_HTTPS_ENFORCE:false}
    # 密码策略（docs/07 待整改 ④）：默认安全但不锁死历史账号
    password:
      # 最短长度（上限固定 64）
      min-length: ${NEXPLM_PWD_MIN_LENGTH:8}
      # 需包含的字符类数量（大写/小写/数字/符号，取 1~4）
      required-classes: ${NEXPLM_PWD_REQUIRED_CLASSES:3}
      # 历史不可重用条数（0=不检查）
      history-size: ${NEXPLM_PWD_HISTORY_SIZE:3}
      # 有效期天数（0=不过期；>0 时登录会校验 pwd_updated_at）
      expire-days: ${NEXPLM_PWD_EXPIRE_DAYS:0}
    bootstrap:
      admin-username: ${NEXPLM_ADMIN_USERNAME:admin}
      admin-password: ${NEXPLM_ADMIN_PASSWORD:Admin@12345}
  file:
    # 存储实现：local（本地磁盘，默认）| minio（对象存储，S3 协议）
    storage: ${NEXPLM_FILE_STORAGE:local}
    # 本地存储根目录；内容寻址布局 {root}/{sha[0:2]}/{sha[2:4]}/{sha}
    root: ${NEXPLM_FILE_ROOT:./data/files}
    upload:
      # 上传安全闸门（等保自查整改 ①）：禁止的扩展名，逗号分隔，空串=不拦。
      # 默认挡可执行/服务端脚本/可挂脚本的标记文件；PLM 常见格式（dwg/docx/pdf/step/zip…）不受影响。
      blocked-ext: ${NEXPLM_FILE_BLOCKED_EXT:exe,dll,bat,cmd,ps1,scr,msi,com,pif,jsp,jspx,php,asp,aspx,html,htm,svg}
      # 文件头与扩展名一致性校验（pdf/图片/OOXML/老 Office/zip）；无统一签名的格式自动跳过
      magic-check: ${NEXPLM_FILE_MAGIC_CHECK:true}
    # scan=clamav 时生效：送检地址与流式分块参数
    scan-clamav:
      host: ${NEXPLM_CLAMAV_HOST:127.0.0.1}
      port: ${NEXPLM_CLAMAV_PORT:3310}
      # 建连与读超时（毫秒）；大文件走流式，不会整份读入内存
      timeout-ms: ${NEXPLM_CLAMAV_TIMEOUT_MS:30000}
      # 每次发送的块大小（字节，1KB~64KB）
      chunk-size: ${NEXPLM_CLAMAV_CHUNK_SIZE:8192}
    # storage=minio 时生效；启动时自动创建存储桶
    minio:
      endpoint: ${NEXPLM_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${NEXPLM_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${NEXPLM_MINIO_SECRET_KEY:minioadmin}
      bucket: ${NEXPLM_MINIO_BUCKET:nexplm}
    # 维护任务：回收孤儿物理文件、中断超时分片会话（默认每小时一轮）
    maintenance:
      enabled: ${NEXPLM_FILE_MAINTENANCE:true}
      retain-hours: ${NEXPLM_FILE_RETAIN_HOURS:24}
    # 安全扫描实现：noop（默认不扫描）| clamav（流式送检 clamd，参数见 scan-clamav）
    scan: ${NEXPLM_FILE_SCAN:noop}
  # P9-6 通知通道（SPI）：邮件 / 企业微信 / 钉钉
  notify:
    # 邮件 SMTP 占位符：通道配置里留空的字段回落到这里；两处都空 → 明确报「SMTP 未配置」，不静默丢弃
    # 部署时用环境变量覆盖，示例：
    #   NEXPLM_SMTP_HOST=smtp.example.com
    #   NEXPLM_SMTP_PORT=465
    #   NEXPLM_SMTP_USERNAME=notify@example.com
    #   NEXPLM_SMTP_PASSWORD=******
    #   NEXPLM_SMTP_FROM=notify@example.com
    #   NEXPLM_SMTP_FROM_NAME=NexPLM
    #   NEXPLM_SMTP_SSL=true          # 465 端口直连 TLS
    #   NEXPLM_SMTP_STARTTLS=false    # 587 端口升级 TLS（与 ssl 二选一）
    email:
      host: ${NEXPLM_SMTP_HOST:}
      port: ${NEXPLM_SMTP_PORT:465}
      username: ${NEXPLM_SMTP_USERNAME:}
      password: ${NEXPLM_SMTP_PASSWORD:}
      from: ${NEXPLM_SMTP_FROM:}
      from-name: ${NEXPLM_SMTP_FROM_NAME:NexPLM}
      ssl: ${NEXPLM_SMTP_SSL:true}
      starttls: ${NEXPLM_SMTP_STARTTLS:false}
      # 连接/读写超时（毫秒）
      timeout-ms: ${NEXPLM_SMTP_TIMEOUT_MS:8000}
    # 发送失败退避重试（与 P9-1/P9-4 同口径）
    retry:
      enabled: ${NEXPLM_NOTIFY_RETRY:true}
      base-seconds: 30
      fixed-delay: PT60S
      stale-minutes: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.nexplm: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
