server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: nexplm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${NEXPLM_DB_URL:jdbc:postgresql://localhost:5432/nexplm}
    username: ${NEXPLM_DB_USER:nexplm}
    password: ${NEXPLM_DB_PASSWORD:nexplm}
    hikari:
      maximum-pool-size: ${NEXPLM_DB_POOL_MAX:20}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

flowable:
  # 引擎表（ACT_*）由 Flowable 自管：首次启动自动建表，升级随引擎脚本演进，**不纳入 Flyway**
  database-schema-update: true
  # 默认不启用异步作业线程（超时催办/定时任务接入后再打开）
  async-executor-activate: false
  # 启动时自动部署 classpath:/processes/ 下的流程定义（内容不变则不会重复部署）
  check-process-definitions: true
  process-definition-location-prefix: classpath*:/processes/
  # 只用 BPMN 流程引擎，关掉 CMMN / DMN / 表单 / 事件注册，减少建表与启动开销
  cmmn:
    enabled: false
  dmn:
    enabled: false
  form:
    enabled: false
  eventregistry:
    enabled: false

nexplm:
  # 流程归档后的 ERP 自动下发（ErpPublish 插件）
  workflow:
    erp-publish:
      enabled: ${NEXPLM_WF_ERP_PUBLISH_ENABLED:true}
      dry-run: ${NEXPLM_WF_ERP_PUBLISH_DRY_RUN:false}
      # 多账套时指定 itg_endpoint.code（测试/生产）；留空取 id 最小的启用端点。
      # 配置后找不到该端点会跳过下发，不会静默改用其它账套。
      endpoint-code: ${NEXPLM_WF_ERP_PUBLISH_ENDPOINT_CODE:}
  security:
    jwt:
      # 生产必须通过环境变量覆盖，长度 >= 32 字节
      secret: ${NEXPLM_JWT_SECRET:nexplm-dev-only-secret-key-change-in-production-32b}
      access-ttl: PT30M
      refresh-ttl: P7D
    bootstrap:
      admin-username: ${NEXPLM_ADMIN_USERNAME:admin}
      admin-password: ${NEXPLM_ADMIN_PASSWORD:Admin@12345}
  file:
    # 存储实现：local（本地磁盘，默认）| minio（对象存储，S3 协议）
    storage: ${NEXPLM_FILE_STORAGE:local}
    # 本地存储根目录；内容寻址布局 {root}/{sha[0:2]}/{sha[2:4]}/{sha}
    root: ${NEXPLM_FILE_ROOT:./data/files}
    # storage=minio 时生效；启动时自动创建存储桶
    minio:
      endpoint: ${NEXPLM_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${NEXPLM_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${NEXPLM_MINIO_SECRET_KEY:minioadmin}
      bucket: ${NEXPLM_MINIO_BUCKET:nexplm}
    # 维护任务：回收孤儿物理文件、中断超时分片会话（默认每小时一轮）
    maintenance:
      enabled: ${NEXPLM_FILE_MAINTENANCE:true}
      retain-hours: ${NEXPLM_FILE_RETAIN_HOURS:24}
    # 安全扫描实现：noop（默认不扫描）| 接入杀毒引擎时改为自定义实现名
    scan: ${NEXPLM_FILE_SCAN:noop}
  # P9-6 通知通道（SPI）：邮件 / 企业微信 / 钉钉
  notify:
    # 邮件 SMTP 占位符：通道配置里留空的字段回落到这里；两处都空 → 明确报「SMTP 未配置」，不静默丢弃
    # 部署时用环境变量覆盖，示例：
    #   NEXPLM_SMTP_HOST=smtp.example.com
    #   NEXPLM_SMTP_PORT=465
    #   NEXPLM_SMTP_USERNAME=notify@example.com
    #   NEXPLM_SMTP_PASSWORD=******
    #   NEXPLM_SMTP_FROM=notify@example.com
    #   NEXPLM_SMTP_FROM_NAME=NexPLM
    #   NEXPLM_SMTP_SSL=true          # 465 端口直连 TLS
    #   NEXPLM_SMTP_STARTTLS=false    # 587 端口升级 TLS（与 ssl 二选一）
    email:
      host: ${NEXPLM_SMTP_HOST:}
      port: ${NEXPLM_SMTP_PORT:465}
      username: ${NEXPLM_SMTP_USERNAME:}
      password: ${NEXPLM_SMTP_PASSWORD:}
      from: ${NEXPLM_SMTP_FROM:}
      from-name: ${NEXPLM_SMTP_FROM_NAME:NexPLM}
      ssl: ${NEXPLM_SMTP_SSL:true}
      starttls: ${NEXPLM_SMTP_STARTTLS:false}
      # 连接/读写超时（毫秒）
      timeout-ms: ${NEXPLM_SMTP_TIMEOUT_MS:8000}
    # 发送失败退避重试（与 P9-1/P9-4 同口径）
    retry:
      enabled: ${NEXPLM_NOTIFY_RETRY:true}
      base-seconds: 30
      fixed-delay: PT60S
      stale-minutes: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.nexplm: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
